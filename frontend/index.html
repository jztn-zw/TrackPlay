<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackPlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <header id="topbar">
    <div class="topbar-brand">
      <div class="logo-mark">TP</div>
      <h1>TrackPlay</h1>
    </div>
    <div class="topbar-meta">
      <div class="dot"></div>
      <span>Game Tracker</span>
    </div>
  </header>

  <aside id="left-panel">

    <p class="panel-heading">Add Entry</p>

    <form id="gameForm" autocomplete="off">

      <input type="hidden" id="ID">

      <div class="form-group">
        <label for="game_name">Game Name</label>
        <input type="text" id="game_name" placeholder="e.g. Elden Ring" required>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <input type="text" id="category" placeholder="e.g. RPG, FPS, Strategy">
      </div>

      <div class="form-group">
        <label for="difficulty">Difficulty</label>
        <div class="select-wrapper">
          <select id="difficulty">
            <option value="" disabled selected>Select difficulty</option>
            <option value="easy">⬡  Easy</option>
            <option value="medium">◈  Medium</option>
            <option value="hard">⬟  Hard</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="rating">Rating</label>
        <div class="select-wrapper">
          <select id="rating">
            <option value="" disabled selected>Select rating</option>
            <option value="1">★☆☆☆☆ — 1 / 5</option>
            <option value="2">★★☆☆☆ — 2 / 5</option>
            <option value="3">★★★☆☆ — 3 / 5</option>
            <option value="4">★★★★☆ — 4 / 5</option>
            <option value="5">★★★★★ — 5 / 5</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <div class="select-wrapper">
          <select id="status">
            <option value="" disabled selected>Select status</option>
            <option value="playing">▶  Playing</option>
            <option value="completed">✓  Completed</option>
            <option value="dropped">✕  Dropped</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button id="add" type="submit" class="btn btn-primary">Add Game</button>
        <button id="update" type="button" class="btn btn-secondary">Update</button>
      </div>

    </form>
  </aside>

  <main id="right-panel">
    <ul id="gameList"></ul>
  </main>
</div>

<script src="index.js"></script>
<script>
  // Sync select color class on change + on load (for update pre-fill)
  function syncSelect(id, prefix) {
    const el = document.getElementById(id);
    if (!el) return;
    const apply = () => {
      el.classList.remove(...[...el.classList].filter(c => c.startsWith(prefix)));
      if (el.value) el.classList.add(prefix + el.value);
      if (id === 'rating') el.classList.toggle('has-value', !!el.value);
    };
    el.addEventListener('change', apply);
    apply();
  }
  syncSelect('difficulty', 'val-');
  syncSelect('status',     'val-');
  syncSelect('rating',     'val-');
</script>

</body>
</html>

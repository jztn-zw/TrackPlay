<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackPlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>TrackPlay</h1>

    <form id="gameForm">
        <label>Game Name:</label><br>
        <input type="text" id="game_name" required><br><br>

        <label>Category:</label><br>
        <input type="text" id="category"><br><br>

        <label>Difficulty:</label><br>
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select><br><br>

        <label>Rating (1-5):</label><br>
        <input type="number" id="rating" min="1" max="5"><br><br>

        <label>Status:</label><br>
        <select id="status">
            <option value="playing">Playing</option>
            <option value="completed">Completed</option>
            <option value="dropped">Dropped</option>
        </select><br><br>

        <button id="add" type="submit">Add Game</button>
        <button id="update" type="button">Update Game</button>
    </form>

    <hr>

    <h2>Game List</h2>
    <ul id="gameList">
        
    </ul>

    <script src="index.js"></script>
</body>
</html>

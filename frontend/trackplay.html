<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackPlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- TOP BAR -->
  <header id="topbar">
    <div class="topbar-brand">
      <div class="logo-mark">TP</div>
      <h1>TrackPlay</h1>
    </div>
    <div class="topbar-meta">
      <div class="dot"></div>
      <span>Game Tracker</span>
    </div>
  </header>

  <!-- LEFT PANEL — FORM -->
  <aside id="left-panel">

    <p class="panel-heading">Add Entry</p>

    <form id="gameForm" autocomplete="off">

      <!-- Hidden ID field required by PUT in index.js -->
      <input type="hidden" id="ID">

      <div class="form-group">
        <label for="game_name">Game Name</label>
        <input type="text" id="game_name" placeholder="e.g. Elden Ring" required>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <input type="text" id="category" placeholder="e.g. RPG, FPS, Strategy">
      </div>

      <div class="form-group">
        <label for="difficulty">Difficulty</label>
        <div class="select-wrapper">
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="rating">Rating</label>
        <div class="select-wrapper">
          <select id="rating">
            <option value="" disabled selected>Select rating</option>
            <option value="1">★☆☆☆☆ — 1 / 5</option>
            <option value="2">★★☆☆☆ — 2 / 5</option>
            <option value="3">★★★☆☆ — 3 / 5</option>
            <option value="4">★★★★☆ — 4 / 5</option>
            <option value="5">★★★★★ — 5 / 5</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <div class="select-wrapper">
          <select id="status">
            <option value="playing">Playing</option>
            <option value="completed">Completed</option>
            <option value="dropped">Dropped</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button id="add" type="submit" class="btn btn-primary">Add Game</button>
        <button id="update" type="button" class="btn btn-secondary">Update</button>
      </div>

    </form>
  </aside>

  <!-- RIGHT PANEL — BENTO CARD GRID -->
  <main id="right-panel">

    <!-- Bento cards injected here by index.js -->
    <ul id="gameList"></ul>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>
